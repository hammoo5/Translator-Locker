<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>برنامج ترجمة نصوص - تصميم فخم</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
    body {
        margin: 0;
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(135deg, #2c3e50, #4ca1af);
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1350&q=80');
        background-size: cover;
        background-position: center;
        position: relative;
    }
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 0;
        backdrop-filter: blur(6px);
    }
    .container {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        padding: 30px 40px;
        border-radius: 20px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
    }
    h2 {
        margin-bottom: 25px;
        font-weight: 700;
        font-size: 2.8rem;
        letter-spacing: 1.5px;
        text-shadow: 0 0 10px #ffd700;
    }
    textarea {
        width: 100%;
        height: 140px;
        font-size: 1.2rem;
        padding: 15px;
        border-radius: 15px;
        border: none;
        resize: vertical;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        outline: none;
        transition: background 0.3s ease;
    }
    textarea:focus {
        background: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 20px #ffd700;
    }
    select {
        font-size: 1.1rem;
        padding: 12px 18px;
        border-radius: 15px;
        border: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        outline: none;
        transition: background 0.3s ease;
        margin-right: 10px;
    }
    select:hover, select:focus {
        background: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 20px #ffd700;
    }
    button {
        font-size: 1.2rem;
        padding: 12px 25px;
        border-radius: 20px;
        border: none;
        background: linear-gradient(45deg, #ff6f61, #d72631);
        color: white;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 0 15px #d72631;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
        background: linear-gradient(45deg, #d72631, #ff6f61);
        box-shadow: 0 0 30px #ffd700;
    }
    #output {
        margin-top: 25px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        min-height: 100px;
        font-size: 1.3rem;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
        color: #fff;
        white-space: pre-wrap;
        text-align: left;
    }
    /* أيقونة ترجمة صغيرة */
    .translate-icon {
        width: 36px;
        height: 36px;
        vertical-align: middle;
        margin-left: 10px;
        filter: drop-shadow(0 0 3px #ffd700);
    }
    @media (max-width: 650px) {
        .container {
            padding: 20px;
        }
        textarea {
            height: 110px;
        }
        h2 {
            font-size: 2rem;
        }
    }
</style>
</head>
<body>
<div class="container">
    <h2>برنامج ترجمة نصوص مجاني
        <img class="translate-icon" src="https://cdn-icons-png.flaticon.com/512/2767/2767403.png" alt="ترجمة" />
    </h2>
    <textarea id="inputText" placeholder="اكتب النص هنا"></textarea><br />
    <select id="languageSelect" aria-label="اختر اللغة">
        <option value="ar">العربية</option>
        <option value="en" selected>الإنجليزية</option>
        <option value="fr">الفرنسية</option>
        <option value="es">الإسبانية</option>
        <option value="de">الألمانية</option>
        <option value="zh-CN">الصينية المبسطة</option>
        <option value="ja">اليابانية</option>
        <option value="ru">الروسية</option>
        <option value="hi">الهندية</option>
        <option value="it">الإيطالية</option>
    </select>
    <button onclick="translateText()">ترجم</button>

    <div id="output" aria-live="polite" aria-atomic="true" placeholder="الترجمة ستظهر هنا"></div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const targetLang = document.getElementById('languageSelect').value;
        const output = document.getElementById('output');

        if (!text) {
            output.textContent = 'من فضلك اكتب نص للترجمة.';
            return;
        }

        output.textContent = '...جاري الترجمة';

        try {
            const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);

            if (!response.ok) throw new Error('فشل الاتصال بخدمة الترجمة');

            const data = await response.json();
            const translatedText = data[0].map(item => item[0]).join('');
            output.textContent = translatedText;
        } catch (error) {
            output.textContent = 'حدث خطأ أثناء الترجمة، حاول مرة أخرى.';
            console.error(error);
        }
    }
</script>
</body>
</html>
